<title>TOTR 4.2 – Demo Guide</title>
<style>

  .header-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }

  .intro-box { background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 24px; font-size: 13px; color: var(--info-text); line-height: 1.6; }

  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; user-select: none; }
  .section-icon { font-size: 20px; width: 32px; text-align: center; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; }

  .divider { height: 1px; background: var(--border); margin-bottom: 12px; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }

  .card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .tag-web { background: var(--success-bg); color: var(--success-text); }
  .tag-admin { background: var(--info-bg); color: var(--info-text); }
  .tag-android { background: var(--android-bg); color: var(--android-text); }

  .detail { display: none; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 16px; margin-top: 10px; }
  .detail.open { display: block; }
  .detail h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .detail ul { padding-left: 18px; margin-bottom: 10px; }
  .detail ul li { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 2px; }
  .detail ul li strong { color: var(--text); font-weight: 700; }
  .demo-tip { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--warn-text); line-height: 1.6; margin-top: 8px; }
  .demo-tip strong { font-weight: 700; }
  .android-note { background: var(--android-bg); border: 1px solid var(--android-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--android-text); line-height: 1.6; margin-top: 8px; }
  .android-note strong { font-weight: 700; }

  /* SharePoint tip box */
  .sharepoint-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 24px; font-size: 12px; color: var(--text2); }
  .sharepoint-box strong { color: var(--text); }

  /* Footer */
  .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); margin-top: 20px; }
</style>

let currentLang = 'fr';
let openCard = null;

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.documentElement.lang = lang;
  renderAll();
}

function badgeHTML(type) {
  const labels = {
    fr: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' },
    nl: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' },
    en: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' }
  };
  return `<span class="badge badge-${type}">${labels[currentLang][type]||type}</span>`;
}

function tagHTML(type) {
  const labels = { web:'WebChat', admin:'Admin', android:'Android' };
  return `<span class="tag tag-${type}">${labels[type]||type}</span>`;
}

function renderAll() {
  const t = T[currentLang];
  document.getElementById('h-title').textContent = t.title;
  document.getElementById('h-sub').textContent = t.sub;
  document.getElementById('intro-box').textContent = t.intro;

  const sections = t.sections;
  const toc = document.getElementById('toc-bar');
  toc.innerHTML = '';
  sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'toc-pill';
    btn.textContent = s.icon + ' ' + s.title;
    btn.onclick = () => document.getElementById('s'+i).scrollIntoView({behavior:'smooth', block:'start'});
    toc.appendChild(btn);
  });

  const container = document.getElementById('sections-container');
  container.innerHTML = '';
  sections.forEach((s, si) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 's'+si;

    const badges = s.badges.map(b => badgeHTML(b)).join('');
    sec.innerHTML = `
      <div class="section-head" onclick="toggleSection(${si})">
        <span class="section-icon">${s.icon}</span>
        <span class="section-title">${s.title}</span>
        <span class="section-badges">${badges}</span>
        <span class="chevron open" id="ch${si}">▼</span>
      </div>
      <div class="divider"></div>
      <div class="card-grid" id="grid${si}"></div>
    `;
    container.appendChild(sec);

    const grid = sec.querySelector('.card-grid');
    s.cards.forEach((c) => {
      const tags = c.tags.map(t => tagHTML(t)).join('');
      const bullets = c.bullets.map(b => `<li>${b}</li>`).join('');
      const tip = c.tip ? `<div class="demo-tip"><strong>${T[currentLang].demotip} :</strong> ${c.tip}</div>` : '';
      const anote = c.android ? `<div class="android-note"><strong>${T[currentLang].androidnote} :</strong> ${c.android}</div>` : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-'+c.id;
      card.innerHTML = `<div class="card-title">${tags} ${c.title}</div><div class="card-desc">${c.desc}</div>`;
      card.onclick = () => openDetail(c.id, c.h3, bullets, tip, anote);
      grid.appendChild(card);
    });

    // Detail panel placeholder after grid
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.id = 'det-placeholder-'+si;
    sec.appendChild(detail);
  });
}

function openDetail(id, h3, bullets, tip, anote) {
  // Find or create detail panel near this card
  const card = document.getElementById('card-'+id);
  if (!card) return;

  const section = card.closest('.section');
  const placeholder = section.querySelector('.detail');

  if (openCard === id) {
    // Close
    placeholder.classList.remove('open');
    card.classList.remove('active');
    openCard = null;
    return;
  }

  // Close previous in any section
  document.querySelectorAll('.detail.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));

  placeholder.innerHTML = `<h3>${h3}</h3><ul>${bullets}</ul>${tip}${anote}`;
  placeholder.classList.add('open');
  card.classList.add('active');
  openCard = id;

  setTimeout(() => placeholder.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
}

function toggleSection(si) {
  const grid = document.getElementById('grid'+si);
  const chevron = document.getElementById('ch'+si);
  if (!grid) return;
  const isOpen = grid.style.display !== 'none';
  grid.style.display = isOpen ? 'none' : 'grid';
  chevron.classList.toggle('open', !isOpen);
  if (isOpen) {
    document.querySelectorAll(`#s${si} .detail.open`).forEach(d => d.classList.remove('open'));
  }
}

// Initial render
renderAll();
</script>
</body>
</html>
